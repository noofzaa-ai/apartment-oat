<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบผู้เช่า — ระบบจัดการหอพัก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    /* ── Tenant login — warm, friendly, mobile-first ── */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-6) var(--space-4);
      /* Warm gradient background — distinct from admin's cool gray */
      background: linear-gradient(160deg, #FFF8F3 0%, #FFF3E8 40%, #F0F5FF 100%);
    }

    /* ── Logo bar ── */
    .tenant-logo-bar {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .tenant-logo-mark {
      width: 56px;
      height: 56px;
      background: var(--color-primary);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-3);
      box-shadow: 0 6px 18px rgba(45,91,227,0.3);
    }

    .tenant-logo-mark svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    .tenant-brand-name {
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--color-neutral-900);
    }

    .tenant-brand-sub {
      font-size: var(--text-xs);
      color: var(--color-neutral-600);
      margin-top: 2px;
    }

    /* ── Card wrap ── */
    .tenant-card {
      width: 100%;
      max-width: 420px;
      background: var(--color-white);
      border: 1px solid var(--color-neutral-200);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04);
      padding: var(--space-8) var(--space-8);
    }

    .tenant-card-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    /* Warm role badge */
    .tenant-role-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 5px 14px;
      background: #FFF3E8;
      border: 1px solid #FDD5B0;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 600;
      color: #C05B10;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: var(--space-4);
    }

    .tenant-role-badge svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .tenant-title {
      font-size: var(--text-2xl);
      font-weight: 800;
      color: var(--color-neutral-900);
      letter-spacing: -0.02em;
      margin-bottom: var(--space-2);
    }

    .tenant-subtitle {
      font-size: var(--text-sm);
      color: var(--color-neutral-600);
      line-height: var(--leading-snug);
    }

    /* ── Form ── */
    .tenant-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    /* Override shared input alignment for email */
    .tenant-form input[type="email"],
    .tenant-form input[type="text"] {
      text-align: left;
      font-family: var(--font-sans);
      padding-left: 44px;
    }

    .input-icon-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--color-neutral-400);
      fill: none;
      stroke-width: 1.75;
      pointer-events: none;
      transition: stroke var(--transition-fast);
    }

    .input-icon-wrap:focus-within .input-icon {
      stroke: var(--color-primary);
    }

    /* ── PIN Input — 6 individual boxes ── */
    .pin-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .pin-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pin-label {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-neutral-900);
    }

    .pin-hint {
      font-size: var(--text-xs);
      color: var(--color-neutral-400);
    }

    .pin-boxes {
      display: flex;
      gap: clamp(6px, 2vw, 10px);
      justify-content: center;
      /* Fieldset provides semantic grouping — no extra wrapper needed */
    }

    .pin-box {
      /* clamp: shrinks on narrow screens (min 40px) but stays 52px on desktop */
      width: clamp(40px, 12vw, 52px);
      height: clamp(48px, 14vw, 60px);
      border: 2px solid var(--color-neutral-200);
      border-radius: var(--radius-md);
      background: var(--color-white);
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--color-neutral-900);
      text-align: center;
      caret-color: var(--color-primary);
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      /* iOS: disable zoom on focus (font-size must be ≥16px) */
      font-size: max(1.25rem, 16px);
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
    }

    .pin-box:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(45,91,227,0.15);
      background: var(--color-primary-light);
    }

    .pin-box.filled {
      border-color: var(--color-neutral-400);
      background: var(--color-neutral-50);
    }

    .pin-box.pin-error {
      border-color: var(--color-error);
      background: var(--color-error-bg);
      animation: pinShake 300ms ease;
    }

    @keyframes pinShake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-4px); }
      75%      { transform: translateX(4px); }
    }

    /* Numeric keypad hint on mobile */
    .pin-keypad-hint {
      text-align: center;
      font-size: var(--text-xs);
      color: var(--color-neutral-400);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
    }

    .pin-keypad-hint svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
    }

    /* ── Submit ── */
    .tenant-submit {
      width: 100%;
      height: 52px;
      font-size: var(--text-md);
      border-radius: var(--radius-lg);
      touch-action: manipulation;
    }

    /* ── Error ── */
    .auth-error {
      display: none;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--color-error-bg);
      border: 1px solid var(--color-error-border);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      color: var(--color-error);
    }

    .auth-error.visible { display: flex; }

    .auth-error svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .tenant-footer {
      text-align: center;
      margin-top: var(--space-6);
      font-size: var(--text-xs);
      color: var(--color-neutral-400);
    }

    .tenant-footer a {
      color: var(--color-primary);
      font-weight: 600;
      text-decoration: none;
    }

    .tenant-footer a:hover {
      text-decoration: underline;
    }

    /* ── Mobile adjustments ── */
    @media (max-width: 460px) {
      body {
        justify-content: flex-start;
        padding-top: var(--space-10);
      }

      .tenant-card {
        padding: var(--space-6) var(--space-5);
        border-radius: 16px;
      }

      .pin-box {
        width: 44px;
        height: 54px;
      }

      .pin-boxes {
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="tenant-logo-bar">
    <div class="tenant-logo-mark">
      <svg viewBox="0 0 20 20"><path d="M10 1L2 8v11h5v-7h6v7h5V8L10 1z"/></svg>
    </div>
    <div class="tenant-brand-name">ระบบจัดการหอพัก</div>
    <div class="tenant-brand-sub">พอร์ทัลสำหรับผู้เช่า</div>
  </div>

  <!-- Card -->
  <div class="tenant-card" role="main">

    <div class="tenant-card-header">
      <div class="tenant-role-badge">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        ผู้เช่า
      </div>
      <h1 class="tenant-title">เข้าสู่ระบบ</h1>
      <p class="tenant-subtitle">กรอกอีเมลและ PIN 6 หลัก<br>ที่ได้รับจากทางหอพัก</p>
    </div>

    <!-- Error banner -->
    <div class="auth-error" id="authError" role="alert" aria-live="polite" style="margin-bottom: var(--space-4);">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      อีเมลหรือ PIN ไม่ถูกต้อง กรุณาตรวจสอบและลองใหม่
    </div>

    <form
      class="tenant-form"
      id="tenantLoginForm"
      novalidate
      aria-label="แบบฟอร์มเข้าสู่ระบบผู้เช่า"
      onsubmit="handleTenantLogin(event)"
    >
      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="tenantEmail">
          อีเมล <span class="form-required" aria-hidden="true">*</span>
        </label>
        <div class="input-icon-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            type="email"
            id="tenantEmail"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
            spellcheck="false"
            required
            aria-required="true"
            inputmode="email"
            oninput="clearError()"
          >
        </div>
      </div>

      <!-- PIN -->
      <div class="pin-section">
        <div class="pin-label-row">
          <span class="pin-label" id="pinLabel">PIN 6 หลัก</span>
          <span class="pin-hint">ได้รับจากทางหอพัก</span>
        </div>

        <!-- Fieldset groups the 6 inputs semantically -->
        <fieldset style="border: none; padding: 0; margin: 0;" aria-labelledby="pinLabel">
          <legend class="visually-hidden">กรอก PIN 6 หลัก</legend>
          <div class="pin-boxes" role="group">
            <input type="text" class="pin-box" id="pin0" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" aria-label="PIN หลักที่ 1" oninput="pinInput(this,0)" onkeydown="pinKeydown(event,0)">
            <input type="text" class="pin-box" id="pin1" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="PIN หลักที่ 2" oninput="pinInput(this,1)" onkeydown="pinKeydown(event,1)">
            <input type="text" class="pin-box" id="pin2" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="PIN หลักที่ 3" oninput="pinInput(this,2)" onkeydown="pinKeydown(event,2)">
            <input type="text" class="pin-box" id="pin3" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="PIN หลักที่ 4" oninput="pinInput(this,3)" onkeydown="pinKeydown(event,3)">
            <input type="text" class="pin-box" id="pin4" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="PIN หลักที่ 5" oninput="pinInput(this,4)" onkeydown="pinKeydown(event,4)">
            <input type="text" class="pin-box" id="pin5" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" aria-label="PIN หลักที่ 6" oninput="pinInput(this,5)" onkeydown="pinKeydown(event,5)">
          </div>
        </fieldset>

        <div class="pin-keypad-hint">
          <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></svg>
          แป้นตัวเลขจะเปิดอัตโนมัติบนมือถือ
        </div>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="btn btn-primary tenant-submit"
        id="tenantSubmitBtn"
      >
        เข้าสู่ระบบ
      </button>
    </form>

  </div>

  <div class="tenant-footer" style="margin-top: var(--space-5);">
    เป็นผู้ดูแลระบบ? <a href="05-login-admin.html">เข้าสู่ระบบ Admin</a>
    <br><br>
    <a href="#" onclick="return false" style="color: var(--color-neutral-400)">ลืม PIN? ติดต่อทางหอพัก</a>
  </div>

  <!-- Toast -->
  <div class="toast toast-hidden" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ── PIN input controller ──────────────────────────────────
    const PIN_LENGTH = 6;

    function pinInput(el, idx) {
      // Only allow digits
      el.value = el.value.replace(/[^0-9]/g, '');

      if (el.value.length === 1) {
        el.classList.add('filled');
        el.classList.remove('pin-error');
        // Auto-advance to next box
        if (idx < PIN_LENGTH - 1) {
          document.getElementById('pin' + (idx + 1)).focus();
        }
        // If last box filled, try submit after brief delay
        if (idx === PIN_LENGTH - 1) {
          const allFilled = Array.from({length: PIN_LENGTH}, (_, i) =>
            document.getElementById('pin' + i).value
          ).every(v => v !== '');
          if (allFilled) {
            document.getElementById('tenantSubmitBtn').focus();
          }
        }
      } else {
        el.classList.remove('filled');
      }
      clearError();
    }

    function pinKeydown(event, idx) {
      if (event.key === 'Backspace') {
        const el = document.getElementById('pin' + idx);
        if (el.value === '' && idx > 0) {
          // Move back and clear
          const prev = document.getElementById('pin' + (idx - 1));
          prev.value = '';
          prev.classList.remove('filled');
          prev.focus();
        } else {
          el.value = '';
          el.classList.remove('filled');
        }
      }
      if (event.key === 'ArrowLeft' && idx > 0) {
        document.getElementById('pin' + (idx - 1)).focus();
      }
      if (event.key === 'ArrowRight' && idx < PIN_LENGTH - 1) {
        document.getElementById('pin' + (idx + 1)).focus();
      }
    }

    function getPinValue() {
      return Array.from({length: PIN_LENGTH}, (_, i) =>
        document.getElementById('pin' + i).value
      ).join('');
    }

    function shakePinBoxes() {
      for (let i = 0; i < PIN_LENGTH; i++) {
        const box = document.getElementById('pin' + i);
        box.classList.add('pin-error');
        box.value = '';
        box.classList.remove('filled');
      }
      document.getElementById('pin0').focus();
    }

    function clearError() {
      document.getElementById('authError').classList.remove('visible');
    }

    // ── Form submit ──────────────────────────────────────────
    function handleTenantLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('tenantSubmitBtn');
      const pin = getPinValue();
      const email = document.getElementById('tenantEmail').value;

      if (!email || pin.length < PIN_LENGTH) {
        // Show inline error
        document.getElementById('authError').classList.add('visible');
        if (pin.length < PIN_LENGTH) shakePinBoxes();
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.textContent = 'กำลังตรวจสอบ…';

      // Simulate: show error demo after delay
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
        document.getElementById('authError').classList.add('visible');
        shakePinBoxes();
      }, 1200);
    }

    // Support paste of full 6-digit code into first box
    document.getElementById('pin0').addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'');
      for (let i = 0; i < Math.min(PIN_LENGTH, text.length); i++) {
        const box = document.getElementById('pin' + i);
        box.value = text[i];
        box.classList.add('filled');
      }
      const nextFocus = Math.min(text.length, PIN_LENGTH - 1);
      document.getElementById('pin' + nextFocus).focus();
    });
  </script>
</body>
</html>
